pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            url "https://repo.spring.io/release"
        }
    }
}

rootProject.name = 'simplix'
include 'simplix-core'
include 'simplix-auth'
include 'simplix-messaging'
include 'simplix-mybatis'
include 'simplix-hibernate'
include 'simplix-cache'
include 'simplix-excel'
include 'simplix-encryption'
include 'simplix-file'
include 'simplix-email'
include 'simplix-scheduler'
include 'simplix-stream'
include 'simplix-sync'
include 'spring-boot-starter-simplix'
include 'simplix-egov'
// Deliberately absent from spring-boot-starter-simplix: it carries the license SDK, which
// only an application that is licensed has any use for.
include 'simplix-license'

def props = new Properties()
def propertiesFile = file("gradle.properties")
if (propertiesFile.exists()) {
    propertiesFile.withInputStream { props.load(it) }
} else {
    logger.warn("gradle.properties file not found. Using environment variables for GitHub credentials.")
}

// How to configure gradle.properties:
//   gpr.user=your_github_username
//   gpr.token=your_github_personal_access_token
// 
// How to generate GitHub Personal Access Token:
//   1. GitHub -> Settings -> Developer settings -> Personal access tokens -> Tokens (classic)
//   2. Generate new token
//   3. Required permission: read:packages
//   4. Set the generated token in gradle.properties as gpr.token

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            url "https://repo.spring.io/release"
            content {
                excludeGroup "dev.simplecore.searchable"
                excludeGroup "dev.simplecore.simplix"
            }
        }

        maven {
            url = uri("https://maven.pkg.github.com/simplecore-inc/simplix")
            credentials {
                username = props.getProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = props.getProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
            content {
                includeGroup "dev.simplecore.simplix"
            }
            metadataSources {
                gradleMetadata()
                mavenPom()
            }
        }

        maven {
            url = "https://maven.egovframe.go.kr/maven/"
            content {
                includeGroup "org.egovframe.rte"
            }
        }

        // The license SDK, consumed by simplix-license. Scoped to its own group so a developer
        // without credentials for it still resolves everything else.
        maven {
            url = uri("https://maven.pkg.github.com/accesscore-dev/accesscore-license-sdk-dist")
            credentials {
                username = props.getProperty("accesscore.gpr.user") ?: System.getenv("ACCESSCORE_GITHUB_USERNAME")
                password = props.getProperty("accesscore.gpr.token") ?: System.getenv("ACCESSCORE_GITHUB_TOKEN")
            }
            content {
                includeGroup "dev.accesscore"
            }
        }

        maven {
            url = uri("https://maven.pkg.github.com/simplecore-inc/searchable-jpa")
            credentials {
                username = props.getProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = props.getProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
            content {
                includeGroup "dev.simplecore.searchable"
            }
            metadataSources {
                gradleMetadata()
                mavenPom()
            }
        }
    }
}